server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  # Canonical host redirect: redirect apex domain to www
  if ($host = "teleprompter.wtf") {
    return 301 https://www.teleprompter.wtf$request_uri;
  }

  # These guides are present on the live site but not in this source tree. Keep
  # their accumulated links and crawl history when the current build is deployed.
  location ~ ^/guides/teleprompter-for-interviews/?$ {
    return 301 https://www.teleprompter.wtf/guides/teleprompter-for-zoom$is_args$args;
  }

  location ~ ^/guides/teleprompter-for-online-courses/?$ {
    return 301 https://www.teleprompter.wtf/guides/teleprompter-for-video-recording$is_args$args;
  }

  location ~ ^/guides/teleprompter-for-phone-and-tablet/?$ {
    return 301 https://www.teleprompter.wtf/compatibility$is_args$args;
  }

  location ~ ^/guides/teleprompter-for-podcasts/?$ {
    return 301 https://www.teleprompter.wtf/guides/how-to-use-a-teleprompter$is_args$args;
  }

  location ~ ^/guides/teleprompter-for-short-form-video/?$ {
    return 301 https://www.teleprompter.wtf/guides/teleprompter-for-youtube$is_args$args;
  }

  location ~ ^/guides/teleprompter-for-webinars/?$ {
    return 301 https://www.teleprompter.wtf/guides/teleprompter-for-zoom$is_args$args;
  }

  location ~ ^/guides/teleprompter-keyboard-shortcuts/?$ {
    return 301 https://www.teleprompter.wtf/guides/how-to-use-a-teleprompter$is_args$args;
  }

  location ~ ^/guides/teleprompter-mirror-mode-glass/?$ {
    return 301 https://www.teleprompter.wtf/guides/teleprompter-camera-distance-and-font-size$is_args$args;
  }

  # A static build makes each route available through several physical paths
  # (`/guide`, `/guide/`, and `/guide/index.html`).  Serving all of them as 200
  # creates duplicate crawl candidates, even though the HTML canonical is set.
  # Redirect them at the server so crawlers and users reach the one clean URL.
  location = /index.html {
    return 308 https://www.teleprompter.wtf/$is_args$args;
  }

  location ~ ^(?<canonical_path>.+)/index\.html$ {
    return 308 https://www.teleprompter.wtf$canonical_path$is_args$args;
  }

  location ~ ^(?<canonical_path>.+)/$ {
    return 308 https://www.teleprompter.wtf$canonical_path$is_args$args;
  }

  # Canonical Coolify/ops health probe. Cheap, noindex, never cached.
  location = /health {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 200 'ok\n';
  }

  # Compatibility probe retained for older deploy scripts.
  location = /health.txt {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /health.txt =404;
  }

  location ^~ /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ^~ /models/ {
    include /etc/nginx/snippets/security-headers.conf;
    types {
      application/javascript mjs;
      application/wasm wasm;
      application/json json;
      text/plain txt;
      application/octet-stream onnx;
    }
    gzip off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Accept-Ranges "bytes";
    try_files $uri =404;
  }

  location ~ ^/(robots\.txt|llms\.txt|sitemap.*\.xml)$ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri.html $uri/index.html $uri =404;
  }

  error_page 404 /404.html;
}
